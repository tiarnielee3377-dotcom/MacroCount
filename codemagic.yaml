workflows:
  ios-capacitor-workflow:
    name: MacroCount iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
    scripts:
      - name: Enable pnpm
        script: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor iOS
        script: pnpm --filter @workspace/macrosnap exec cap sync ios
      - name: Install CocoaPods dependencies
        script: cd artifacts/macrosnap/ios/App && pod install
    artifacts:
      - artifacts/macrosnap/ios/App/build/**/*.xcarchive