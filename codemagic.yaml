workflows:
  ios-capacitor-workflow:
    name: MacroCount iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic-Admin
    environment:
      groups:
        - ios_signing
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.macrocount.app"
    scripts:
      - name: Enable pnpm
        script: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        script: pnpm install --frozen-lockfile
      - name: Build web assets
        script: PORT=5173 BASE_PATH=/ VITE_API_BASE_URL=https://macro-count.replit.app pnpm --filter @workspace/macrosnap run build
      - name: Sync Capacitor iOS
        script: pnpm --filter @workspace/macrosnap exec cap sync ios
      - name: Fix Podfile plugin paths
        script: node scripts/fix-podfile-paths.cjs
      - name: Set up keychain to be used for codesigning
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: cd artifacts/macrosnap/ios/App && pod install
      - name: Increment iOS build number
        script: |
          cd artifacts/macrosnap/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number --platform=IOS --all-versions 6809140735)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/macrosnap/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.xcarchive