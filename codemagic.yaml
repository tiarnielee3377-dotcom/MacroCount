workflows:
  ios-capacitor-workflow:
    name: MacroCount iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_SCHEME: "App"
    scripts:
      - name: Enable pnpm
        script: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor iOS
        script: pnpm --filter @workspace/macrosnap exec cap sync ios
      - name: Debug SPM camera path
        script: |
          echo "--- Package.swift camera reference ---"
          grep -B2 -A2 "capacitor+camera\|CapacitorCamera" artifacts/macrosnap/ios/App/CapApp-SPM/Package.swift
          echo "--- Actual pnpm store contents ---"
          find artifacts/macrosnap/node_modules/.pnpm -maxdepth 1 -iname "*capacitor+camera*" 2>/dev/null || find node_modules/.pnpm -maxdepth 1 -iname "*capacitor+camera*" 2>/dev/null
      - name: Fix SPM plugin paths
        script: |
          SPM_FILE="artifacts/macrosnap/ios/App/CapApp-SPM/Package.swift"
          for plugin in camera local-notifications; do
            REAL_PATH=$(node -e "console.log(require.resolve('@capacitor/$plugin/package.json', {paths:['artifacts/macrosnap']}).replace('/package.json',''))")
            echo "Resolved @capacitor/$plugin -> $REAL_PATH"
            test -d "$REAL_PATH" && echo "Confirmed folder exists" || echo "WARNING: folder not found"
            ESCAPED=$(printf '%s\n' "$REAL_PATH" | sed 's/[&/\]/\\&/g')
            sed -i.bak -E "s#path: \"[^\"]*@capacitor/$plugin\"#path: \"$ESCAPED\"#" "$SPM_FILE"
          done
          echo "--- Final Package.swift paths ---"
          grep 'path:' "$SPM_FILE"
      - name: Resolve Swift Package dependencies
        script: xcodebuild -resolvePackageDependencies -project artifacts/macrosnap/ios/App/App.xcodeproj -scheme "$XCODE_SCHEME"
    artifacts:
      - artifacts/macrosnap/ios/App/build/**/*.xcarchive