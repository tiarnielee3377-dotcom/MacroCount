workflows:
  ios-capacitor-workflow:
    name: MacroCount iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
    scripts:
      - name: Install pnpm
        script: npm install --global pnpm
      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile
      - name: Sync Capacitor iOS
        script: pnpm --filter @workspace/macrosnap exec cap sync ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
    artifacts:
      - ios/App/build/**/*.xcarchive