workflows:
  ios-capacitor-workflow:
    name: MacroCount iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
    scripts:
      - name: Enable pnpm
        script: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        script: pnpm install --frozen-lockfile
      - name: Build web assets
        script: PORT=5173 BASE_PATH=/ pnpm --filter @workspace/macrosnap run build
      - name: Sync Capacitor iOS
        script: pnpm --filter @workspace/macrosnap exec cap sync ios
      - name: Fix Podfile plugin paths
        script: node scripts/fix-podfile-paths.cjs
      - name: Install CocoaPods dependencies
        script: cd artifacts/macrosnap/ios/App && pod install
    artifacts:
      - artifacts/macrosnap/ios/App/build/**/*.xcarchive